name: Demo site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.12.23"
      - run: uv sync --locked --managed-python --python 3.13.16
      # The published pages are regenerated by the kernel on every push: the demo is evidence, not a mockup.
      - name: Run the scenarios and render the reports
        run: |
          mkdir -p site
          uv run --frozen principalloop demo --no-open --json --lang en --output site/index.html
          cp docs/images/social-preview.png site/
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
